<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="theme-color" content="#6b8058">
  <title>PEType — 人宠摄影作品集</title>
  <link rel="stylesheet" href="style.css?v=20260820">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="preload" as="style" onload="this.onload=null;this.rel='stylesheet'">
  <noscript><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet"></noscript>
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-icon">🐾</span> PEType</a>
    </div>
  </header>

  <section class="hero">
    <h1>旨在记录</h1>
    <p>记录你与毛孩子之间的每一个温柔瞬间 — 户外、棚拍或上门，随时随地</p>
  </section>

  <section class="filters-container">
    <div class="filter-group">
      <span class="filter-label">类型</span>
      <button class="filter-btn active" data-cat="all" data-type="main">全部</button>
      <button class="filter-btn" data-cat="people-pet" data-type="main">🐾 人宠拍摄</button>
      <button class="filter-btn" data-cat="pet-only" data-type="main">🐕 只拍毛孩子</button>
    </div>
    <div class="filter-group">
      <span class="filter-label">场景</span>
      <button class="filter-btn active" data-cat="all" data-type="sub">全部</button>
      <button class="filter-btn" data-cat="outdoor" data-type="sub">🏔️ 户外拍摄</button>
      <button class="filter-btn" data-cat="studio" data-type="sub">📸 棚拍</button>
      <button class="filter-btn" data-cat="home-visit" data-type="sub">🚪 上门拍摄</button>
    </div>
  </section>

  <section class="gallery" id="gallery">
    <div class="gallery-empty" id="galleryEmpty" style="display:none;">
      <p>🐾 暂无作品，敬请期待</p>
    </div>
  </section>

  <div class="lightbox" id="lightbox">
    <div class="lightbox-body" id="lightboxBody"></div>
  </div>
    <span class="lightbox-prev" id="lightboxPrev">&#10094;</span>
    <span class="lightbox-next" id="lightboxNext">&#10095;</span>
  </div>

  <footer class="footer">
    <p>© 2026 PEType · 旨在记录</p>
  </footer>

  <script src="script.js?v=20260820"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(regs) {
        regs.forEach(function(reg) { reg.unregister(); });
      }).catch(function(){});
      if (window.caches && caches.keys) {
        caches.keys().then(function(keys) {
          keys.forEach(function(k) { caches.delete(k); });
        }).catch(function(){});
      }
    }
  </script>

</body>
</html>
