<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <title>PEType — 管理后台</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap" rel="stylesheet">
</head>
<body>
  <header class="navbar">
    <div class="nav-inner">
      <a href="index.html" class="logo"><span class="logo-icon">🐾</span> PEType</a>
    </div>
  </header>

  <div class="admin-container">
    <h2>📤 上传新作品</h2>
    <p>一次可选择 4–9 张照片组成一组作品集</p>
    <div class="msg" id="msg"></div>
    <form class="admin-form" id="uploadForm">
      <div class="form-group">
        <label>作品图片（4–9 张）</label>
        <input type="file" id="imageInput" accept="image/*" multiple required>
        <small style="color:var(--text3);font-size:.8rem">可一次性选择 4–9 张照片</small>
        <div class="preview-grid" id="previewGrid"></div>
      </div>
      <div class="form-group">
        <label>作品标题</label>
        <input type="text" id="titleInput" placeholder="例如：夕阳下的金毛" required>
      </div>
      <div class="form-group">
        <label>作品描述（可选）</label>
        <textarea id="descInput" placeholder="简短描述这组作品…"></textarea>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label>类型</label>
          <select id="mainCatSelect" required>
            <option value="">请选择</option>
            <option value="people-pet">🐾 人宠拍摄</option>
            <option value="pet-only">🐕 只拍毛孩子</option>
          </select>
        </div>
        <div class="form-group">
          <label>场景</label>
          <select id="subCatSelect" required>
            <option value="">请选择</option>
            <option value="outdoor">🏔️ 户外拍摄</option>
            <option value="studio">📸 棚拍</option>
            <option value="home-visit">🚪 上门拍摄</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button type="submit" class="btn btn-primary">上传作品集</button>
        <button type="button" id="exportBtn" class="btn btn-secondary">📋 导出 JSON</button>
      </div>
    </form>

    <div class="publish-box" style="margin-top:28px;padding:18px;background:#f7f9f4;border:1px solid #d8ddd2;border-radius:12px">
      <h3 style="margin:0 0 10px">🚀 一键发布到 GitHub</h3>
      <p style="margin:0 0 10px;color:#667;font-size:.9rem">填写 GitHub Token（只保存在你的浏览器本地），点"发布到 GitHub"后，主页 1-2 分钟自动更新。</p>
      <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center">
        <input type="password" id="tokenInput" placeholder="ghp_... GitHub Token" style="flex:1;min-width:260px;padding:10px 12px;border:1px solid #d8ddd2;border-radius:8px;font-family:inherit">
        <label style="display:flex;align-items:center;gap:6px;font-size:.85rem;color:#667">
          <input type="checkbox" id="autoPub" checked> 上传后自动发布
        </label>
        <button type="button" id="publishBtn" class="btn btn-primary" style="background:#2d6a4f">发布到 GitHub</button>
      </div>
    </div>
    <div style="margin-top:48px">
      <h2>📋 已有作品</h2>
      <ul id="workList" style="margin-top:18px;list-style:none;padding:0;"></ul>
    </div>
  </div>

  <footer class="footer">
    <p>© 2026 PEType · 管理后台</p>
  </footer>

  <script src="admin.js?v=20260815"></script>
</body>
</html>
